---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: postgresql

# Custom homelab chart (official docker.io/library/postgres image). A
# PostgreSQL MAJOR bump is a dump/restore migration, never a routine chart
# bump — Renovate is capped at <19 on the chart image in helm-charts'
# renovate.json; raise the cap together with a planned migration.
helmCharts:
  - name: postgresql
    repo: oci://registry.example.com/example-org/helm-charts
    version: 1.1.1
    releaseName: postgresql
    namespace: postgresql
    valuesFile: values.yaml

resources:
  - base
  - secrets/authentik-db-external-secret.yaml
  - secrets/docmost-db-external-secret.yaml
  - secrets/docuseal-db-external-secret.yaml
  - secrets/harbor-db-external-secret.yaml
  - secrets/opengist-db-external-secret.yaml
  - secrets/postgresql-external-secret.yaml
