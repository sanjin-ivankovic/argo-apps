---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: postgresql

# Custom homelab chart (official docker.io/library/postgres image). A
# PostgreSQL MAJOR bump is a dump/restore migration, never a routine chart
# bump — Renovate is capped at <19 on both the chart image (helm-charts) and
# the DB-create job image (renovate.json here); raise the caps together with
# a planned migration.
helmCharts:
  - name: postgresql
    repo: oci://registry.example.com/example-org/helm-charts
    version: 1.0.2
    releaseName: postgresql
    namespace: postgresql
    valuesFile: values.yaml

resources:
  - base
  - jobs
  - secrets
