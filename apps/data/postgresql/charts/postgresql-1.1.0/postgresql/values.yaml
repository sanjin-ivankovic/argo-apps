## Default values for PostgreSQL

## @section Image parameters

## @param image.repository The Docker repository to pull the image from.
## @param image.tag The image tag to use (with pinned digest).
## @param image.pullPolicy The logic of image pulling.
##
# Debian variant on purpose: musl (alpine) has no real locale support, and a
# libc swap changes text collation order — an index-corruption class of change
# for an existing cluster. The backup CronJob reuses this same image so pg_dump
# always matches the server version AND so Renovate's primary image rule stays
# the only rule touching this chart (a second image here would need the
# sub-image exclusion dance documented in renovate.json).
image:
  repository: postgres
  tag: "18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6"
  pullPolicy: IfNotPresent

## @param nameOverride String to partially override the chart name.
## @param fullnameOverride String to fully override the resource names.
##
nameOverride: ""
fullnameOverride: ""

## @section Deployment parameters

## @param replicaCount The number of replicas to deploy. Must stay 1: single-node PostgreSQL on a ReadWriteOnce volume; there is no replication support in this chart.
## @param updateStrategy The update strategy for the deployment.
## @param priorityClassName Kubernetes priority class for the pod.
##
replicaCount: 1
# Recreate: PGDATA is a ReadWriteOnce PVC and two postmasters must never open
# the same data directory — the old pod has to be gone before the new one
# attaches.
updateStrategy:
  type: Recreate
priorityClassName: ""

## @section Pod spec parameters

## @param resources If specified, it sets the resource requests and limits for the pod.
## @param nodeSelector Node selector for pod placement.
## @param affinity Pod affinity configuration.
## @param tolerations Pod tolerations configuration.
## @param topologySpreadConstraints Control how pods are spread across your cluster among failure-domains such as regions, zones, nodes, and other user-defined topology domains.
##
resources:
  requests:
    memory: "512Mi"
    cpu: "200m"
  limits:
    memory: "1Gi"
    cpu: "1000m"
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []

## @section Security parameters

## @param podSecurityContext Pod-level security context. The official image's postgres user is uid/gid 999; fsGroupChangePolicy avoids a full recursive chown on every start.
## @param containerSecurityContext Container-level security context. readOnlyRootFilesystem is true; the two paths postgres writes outside the data volume (/run/postgresql for the unix socket, /tmp) are emptyDir mounts in the deployment template.
##
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  readOnlyRootFilesystem: true
  privileged: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

## @section PostgreSQL parameters

## @param postgresql.pgData Path of the data directory inside the volume.
## @param postgresql.initdbArgs Extra arguments for initdb on FIRST boot only (e.g. "--encoding=UTF8 --locale=en_US.UTF-8"). Ignored once the data directory exists.
## @param postgresql.extraArgs Map of postgresql.conf settings rendered as -c key=value container args; changing one rolls the pod.
##
# pgData is deliberately NOT the image default. Since PostgreSQL 18 the
# official image defaults PGDATA to a major-versioned path
# (/var/lib/postgresql/18/docker), so a future major image bump would boot an
# empty cluster next to your data. Pinning a version-independent subdirectory
# of the mounted volume removes that failure mode; the subdirectory (rather
# than the mount root) also keeps initdb from refusing to run over lost+found.
postgresql:
  pgData: /var/lib/postgresql/data/pgdata
  initdbArgs: ""
  extraArgs: {}

## @section Secret parameters

## @param existingSecret Name of an existing secret holding the superuser password. Required for a real deployment; when empty the chart renders without POSTGRES_PASSWORD and the container refuses to initialize a new data directory.
## @param secretKeys.adminPassword Key inside existingSecret that holds the postgres superuser password.
##
existingSecret: ""
secretKeys:
  adminPassword: postgres-password

## @section Service parameters

## @param service.type The type of service to create.
## @param service.port The port the service listens on.
## @param service.loadBalancerIP Static IP for type LoadBalancer (e.g. a MetalLB address); omitted when empty.
## @param service.annotations Extra annotations for the service.
##
service:
  type: ClusterIP
  port: 5432
  loadBalancerIP: ""
  annotations: {}

## @section Persistence parameters

## @param persistence.enabled Whether to enable a PVC for the data directory.
## @param persistence.storageClass The storage class of the PVC; empty uses the cluster default.
## @param persistence.size The requested size of the PVC.
## @param persistence.accessModes The access modes of the PVC.
## @param persistence.mountPath Where the volume is mounted. /var/lib/postgresql matches the PG 18+ image VOLUME; pgData above must live beneath it.
##
persistence:
  enabled: true
  storageClass: ""
  size: 16Gi
  accessModes:
    - ReadWriteOnce
  mountPath: /var/lib/postgresql

## @section Shared memory parameters

## @param shmVolume.enabled Mount an in-memory emptyDir over /dev/shm. Kubernetes' 64Mi default is too small for PostgreSQL's dynamic shared memory (parallel queries).
## @param shmVolume.sizeLimit Size limit of the /dev/shm emptyDir.
##
shmVolume:
  enabled: true
  sizeLimit: 256Mi

## @section Probe parameters

## @param probes.startup.enabled Whether to enable the startup probe. The budget must cover crash-recovery WAL replay after an unclean stop.
## @param probes.liveness.enabled Whether to enable the liveness probe.
## @param probes.readiness.enabled Whether to enable the readiness probe.
##
probes:
  startup:
    enabled: true
    periodSeconds: 5
    failureThreshold: 30
    timeoutSeconds: 3
  liveness:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 6
    timeoutSeconds: 5
  readiness:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5

## @section Backup parameters

## @param backup.enabled Whether to run scheduled pg_dumpall backups to a dedicated PVC.
## @param backup.schedule Cron schedule for the backup job.
## @param backup.retention Number of most recent dumps to keep on the backup volume.
## @param backup.activeDeadlineSeconds Hard runtime limit for one backup job.
## @param backup.startingDeadlineSeconds How late a missed schedule may still start.
## @param backup.successfulJobsHistoryLimit Completed backup jobs to keep.
## @param backup.failedJobsHistoryLimit Failed backup jobs to keep.
## @param backup.resources Resource requests and limits for the backup pod. Kept populated so namespaces with a ResourceQuota accept the pod.
## @param backup.persistence.storageClass The storage class of the backup PVC; empty uses the cluster default.
## @param backup.persistence.size The requested size of the backup PVC.
## @param backup.persistence.accessModes The access modes of the backup PVC.
##
backup:
  enabled: false
  schedule: "0 3 * * *"
  retention: 7
  activeDeadlineSeconds: 3600
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  persistence:
    storageClass: ""
    size: 20Gi
    accessModes:
      - ReadWriteOnce

## @section Database provisioning parameters

## @param databases Per-application databases created by a post-install/post-upgrade hook Job (ArgoCD runs it as PostSync on every sync). Each entry names a Secret in the release namespace holding the database name, owner role and password (keys in databaseJob.secretKeys). Missing roles and databases are created and ownership is reasserted; an existing role's password is never changed, nothing is ever dropped. A listed Secret that does not exist fails the Job after every other entry has been processed.
## @param databaseJob.secretKeys.database Key holding the database name.
## @param databaseJob.secretKeys.username Key holding the owner role name.
## @param databaseJob.secretKeys.password Key holding the owner role password, used only when the role is created.
## @param databaseJob.backoffLimit Retries of the provisioning Job.
## @param databaseJob.activeDeadlineSeconds Hard runtime limit for the provisioning Job.
## @param databaseJob.resources Resource requests and limits for the provisioning pod. Kept populated so namespaces with a ResourceQuota accept the pod.
##
# Example:
#   databases:
#     - secretName: memos-db-secret
databases: []
databaseJob:
  secretKeys:
    database: database
    username: username
    password: password
  backoffLimit: 3
  activeDeadlineSeconds: 600
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"
