---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-harbor-database
  namespace: postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  template:
    spec:
      restartPolicy: Never
      priorityClassName: high-priority-stateful
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
      # Arbitrary non-root uid; the job only runs psql -c over the network
      # and writes nothing to disk.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-database
          image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: postgres-password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: harbor-db-secret
                  key: database
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: harbor-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-db-secret
                  key: password
            - name: POSTGRESQL_HOST
              value: "postgresql"
            - name: POSTGRESQL_PORT
              value: "5432"
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for PostgreSQL at $POSTGRESQL_HOST:$POSTGRESQL_PORT..."
              timeout=300
              elapsed=0
              until pg_isready -h "$POSTGRESQL_HOST" -p "$POSTGRESQL_PORT" -U postgres; do
                if [ $elapsed -ge $timeout ]; then
                  echo "Timeout waiting for PostgreSQL after ${timeout} seconds"
                  exit 1
                fi
                echo "PostgreSQL not ready yet... waiting ($elapsed/${timeout}s)"
                sleep 5
                elapsed=$((elapsed + 5))
              done

              echo "PostgreSQL ready. Provisioning Harbor database '$DB_NAME' / user '$DB_USER'..."

              # Create user only if absent
              if ! psql -h "$POSTGRESQL_HOST" -p "$POSTGRESQL_PORT" -U postgres -tc "SELECT 1 FROM pg_user WHERE usename = '$DB_USER'" | grep -q 1; then
                echo "Creating user '$DB_USER'..."
                psql -h "$POSTGRESQL_HOST" -p "$POSTGRESQL_PORT" -U postgres -c "CREATE USER $DB_USER WITH PASSWORD '$DB_PASSWORD';"
              else
                echo "User '$DB_USER' already exists; ensuring password matches..."
                psql -h "$POSTGRESQL_HOST" -p "$POSTGRESQL_PORT" -U postgres -c "ALTER USER $DB_USER WITH PASSWORD '$DB_PASSWORD';"
              fi

              # Create database only if absent
              if ! psql -h "$POSTGRESQL_HOST" -p "$POSTGRESQL_PORT" -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = '$DB_NAME'" | grep -q 1; then
                echo "Creating database '$DB_NAME' owned by '$DB_USER'..."
                psql -h "$POSTGRESQL_HOST" -p "$POSTGRESQL_PORT" -U postgres -c "CREATE DATABASE $DB_NAME OWNER $DB_USER;"
              else
                echo "Database '$DB_NAME' already exists; reasserting ownership..."
                psql -h "$POSTGRESQL_HOST" -p "$POSTGRESQL_PORT" -U postgres -c "ALTER DATABASE $DB_NAME OWNER TO $DB_USER;"
              fi

              echo "Granting privileges..."
              psql -h "$POSTGRESQL_HOST" -p "$POSTGRESQL_PORT" -U postgres -c "GRANT ALL PRIVILEGES ON DATABASE $DB_NAME TO $DB_USER;"

              # Harbor creates its own schemas (notary, clair, etc.) at startup
              # within the harbor database; granting CREATE on the public
              # schema is sufficient.
              psql -h "$POSTGRESQL_HOST" -p "$POSTGRESQL_PORT" -U postgres -d "$DB_NAME" -c "GRANT ALL ON SCHEMA public TO $DB_USER;"

              echo "Harbor database setup complete."
