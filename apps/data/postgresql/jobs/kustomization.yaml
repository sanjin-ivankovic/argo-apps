---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: postgresql

resources: []
# Database creation jobs are applied MANUALLY, not managed by ArgoCD: a
# Completed one-shot Job never goes OutOfSync, and ArgoCD re-creates stale
# ones on every sync. Apply individually:
#
#   kubectl apply -f apps/data/postgresql/jobs/<name>.yaml
#   kubectl -n postgresql logs -f job/create-<name>-database
