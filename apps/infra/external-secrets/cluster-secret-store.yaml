---
# Every ExternalSecret reads HashiCorp Vault through this store: KV v2 mount
# `kv`, paths kv/k8s/<namespace>/<secret> (policy k8s-read). It logs in with
# a token of the operator's own service account. The audience is the API
# server's own: Vault calls TokenReview with this token, which the API server
# only accepts for its own audience, and Vault rejects a token with more than
# one audience. The Vault role `eso` requires the same (proxmox-infra
# terraform/vault, docs/VAULT.md).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: https://vault.example.com:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
            audiences:
              - https://10.140.0.40:6443
