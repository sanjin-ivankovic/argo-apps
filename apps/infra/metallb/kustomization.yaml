---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: metallb-system

helmCharts:
  - name: metallb
    repo: https://metallb.github.io/metallb
    version: 0.16.1
    releaseName: metallb
    includeCRDs: true
    namespace: metallb-system
    valuesFile: values.yaml

resources:
  - base
  - config
