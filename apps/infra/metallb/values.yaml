---
# ============================================================================
# MetalLB Configuration
# Helm Chart: metallb 0.16.1 (MetalLB)
# Purpose: Bare-metal L2 load balancer — assigns LoadBalancer Service IPs from
#          the homelab address pool (Traefik, GitLab SSH, PostgreSQL, etc.).
# ============================================================================

# ============================================================================
# Controller Configuration
# ============================================================================

controller:
  priorityClassName: critical-infrastructure

  # Schedule on worker nodes.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/worker
                operator: Exists

# ============================================================================
# Speaker Configuration (DaemonSet)
# ============================================================================

speaker:
  priorityClassName: critical-infrastructure
  # info logs a start and end line for every LoadBalancer Service on each
  # Layer2 status reconcile.
  logLevel: warn

  # DaemonSet with no nodeSelector — speakers run on ALL nodes (incl.
  # control-plane, via the toleration) so any node can announce the L2 VIPs.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

# ============================================================================
# BGP backend
# ============================================================================

# The chart enables the frr-k8s BGP backend by default: a 5-container
# DaemonSet on every node plus a status cleaner. This cluster announces its
# pool with L2Advertisement only (config/l2advertisement.yaml), so BGP stays
# off. A future BGPPeer needs this back on first.
frrk8s:
  enabled: false

# Scraped by kube-prometheus-stack (controller and speaker).
prometheus:
  # The metrics endpoints sit behind kube-rbac-proxy; the chart grants this
  # ServiceAccount read access.
  serviceAccount: kube-prometheus-stack-prometheus
  namespace: monitoring
  serviceMonitor:
    enabled: true
