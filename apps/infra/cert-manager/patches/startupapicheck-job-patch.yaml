---
apiVersion: batch/v1
kind: Job
metadata:
  name: cert-manager-startupapicheck
  namespace: cert-manager
spec:
  template:
    spec:
      # Pod-level run-as-non-root (matches the upstream chart's value; also
      # satisfies the pod-level KSV-0118 check on this strategic-merge fragment).
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Deploy on worker nodes
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
      containers:
        - name: cert-manager-startupapicheck
          # Strategic-merge: hardens the upstream one-shot check container.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
