---
# Push endpoint for the Proxmox LXCs (proxmox-infra monitoring_agent role).
# Loki has no authentication (auth_enabled: false), so only the push path is
# routed and it needs basic auth. An IP allowlist would not help: the
# traefik-lan Service uses externalTrafficPolicy Cluster, so Traefik sees node
# IPs, not clients. Queries stay in-cluster (Grafana uses the loki Service).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: loki-push-basicauth
  namespace: monitoring
spec:
  basicAuth:
    # htpasswd lines from the loki-push-auth secret (key `users`, from Vault).
    secret: loki-push-auth
    removeHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: loki-push-ingressroute
  namespace: monitoring
spec:
  entryPoints:
    - lan
  routes:
    - kind: Rule
      match: Host(`loki.example.com`) && Path(`/loki/api/v1/push`)
      middlewares:
        - name: loki-push-basicauth
      services:
        - kind: Service
          name: loki
          port: 3100
