---
# Komodo Core UI/API at komodo.example.com.
#
# No ForwardAuth middleware: Komodo authenticates its own users, so one
# catch-all Host rule serves both the browser UI and the /listener webhook.
# Adding a gate here requires carving /listener back out — see
# docs/SECURITY.md.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: komodo-ingressroute
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`komodo.example.com`)
      services:
        - kind: Service
          name: komodo
          port: 9120
