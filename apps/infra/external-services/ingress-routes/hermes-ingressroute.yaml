---
# Hermes agent web dashboard at hermes.example.com.
#
# No ForwardAuth: the container's own basic_auth is the security boundary
# (configured via env in proxmox-infra services/hermes), and the host is
# LAN-only — not on the cloudflared tunnel.
#
# Sign in at /login. The bare / path redirects to /auth/login, which 500s for a
# password-only provider — an upstream bug.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hermes-ingressroute
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`hermes.example.com`)
      services:
        - kind: Service
          name: hermes
          port: 9119
