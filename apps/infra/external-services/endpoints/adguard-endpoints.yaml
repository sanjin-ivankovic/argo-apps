---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: adguard-1
  namespace: traefik
  labels:
    kubernetes.io/service-name: adguard-1
addressType: IPv4
endpoints:
  - addresses:
      - 10.10.0.12
    conditions:
      ready: true
ports:
  - port: 80
    name: http
    protocol: TCP
---
apiVersion: discovery.k8s.io/v1
