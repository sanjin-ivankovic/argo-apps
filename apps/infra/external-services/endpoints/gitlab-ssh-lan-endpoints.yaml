---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: gitlab-ssh-lan
  namespace: traefik
  labels:
    kubernetes.io/service-name: gitlab-ssh-lan
addressType: IPv4
endpoints:
  - addresses:
      - 10.10.0.10
    conditions:
      ready: true
ports:
  - port: 2222
    name: git-ssh
    protocol: TCP
