---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: bitwarden
  namespace: traefik
  labels:
    kubernetes.io/service-name: bitwarden
addressType: IPv4
endpoints:
  - addresses:
      - 10.10.0.12
    conditions:
      ready: true
ports:
  - port: 8080
    name: http
    protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: bitwarden-smtp
  namespace: traefik
  labels:
    kubernetes.io/service-name: bitwarden-smtp
addressType: IPv4
endpoints:
  - addresses:
      - 10.10.0.12
    conditions:
      ready: true
ports:
  - port: 5000
    name: http
    protocol: TCP
