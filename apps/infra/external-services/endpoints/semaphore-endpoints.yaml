---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: semaphore
  namespace: traefik
  labels:
    kubernetes.io/service-name: semaphore
addressType: IPv4
endpoints:
  - addresses:
      - 10.10.0.16
    conditions:
      ready: true
ports:
  - port: 3000
    name: http
    protocol: TCP
