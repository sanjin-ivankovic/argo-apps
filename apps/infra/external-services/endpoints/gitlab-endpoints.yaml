---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: gitlab
  namespace: traefik
  labels:
    kubernetes.io/service-name: gitlab
addressType: IPv4
endpoints:
  - addresses:
      - 10.10.0.10
    conditions:
      ready: true
ports:
  - port: 8080
    name: http
    protocol: TCP
