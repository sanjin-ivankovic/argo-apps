---
# Komodo Core (service-deployment control plane) runs on the komodo LXC
# (10.10.0.17) outside the cluster. Headless Service + EndpointSlice proxy it
# through Traefik at komodo.example.com.
apiVersion: v1
kind: Service
metadata:
  name: komodo
  namespace: traefik
spec:
  clusterIP: None
  ports:
    - port: 9120
      targetPort: 9120
      name: http
      protocol: TCP
