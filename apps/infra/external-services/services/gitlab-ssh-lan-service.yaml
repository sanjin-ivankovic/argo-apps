---
# GitLab git-over-SSH for source.example.com. Selectorless LoadBalancer on the
# LAN VIP (10.10.0.67), shared with Traefik's `traefik-lan` Service via the
# `lan-shared-ip` key: LAN DNS points source.example.com at that IP for both HTTPS
# and SSH, so the SSH listener lives there too. GitLab owns port 22; kube-proxy
# NATs it to the GitLab LXC's host port 2222 (the LXC's own sshd keeps :22)
# via the EndpointSlice. externalTrafficPolicy: Cluster is required for
# MetalLB IP sharing.
apiVersion: v1
kind: Service
metadata:
  name: gitlab-ssh-lan
  namespace: traefik
  annotations:
    metallb.io/loadBalancerIPs: "10.10.0.67"
    metallb.io/allow-shared-ip: "lan-shared-ip"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  ports:
    - name: git-ssh
      protocol: TCP
      port: 22
      targetPort: 2222 # LXC host port the gitlab container publishes (EndpointSlice)
