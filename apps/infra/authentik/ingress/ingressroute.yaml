---
# The SSO portal itself. This route must NOT carry the authentik-forwardauth
# middleware — Authentik is the auth source, so gating it is a login loop.
#
# No tls: block; the default TLSStore in apps/infra/traefik/values.yaml serves
# the *.example.com wildcard for every route.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik-ingressroute
  namespace: authentik
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`auth.example.com`)
      services:
        - kind: Service
          name: authentik-server
          port: 80
