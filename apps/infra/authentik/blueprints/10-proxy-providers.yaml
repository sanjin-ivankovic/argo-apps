      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    id: privatebin-app
    state: present
    identifiers:
      slug: privatebin
    attrs:
      name: PrivateBin
      provider: !KeyOf privatebin-provider
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf privatebin-app
      group: !Find [authentik_core.group, [name, admins]]
    attrs:
      order: 0

  # --- translate.example.com (LibreTranslate on an external LXC; no auth of
