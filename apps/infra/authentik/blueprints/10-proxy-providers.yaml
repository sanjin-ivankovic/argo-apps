# yamllint disable-file
---
# One forward-auth proxy provider + application + admins-only binding per
# protected host — access fails closed: an app route carrying the
# authentik-forwardauth middleware with no application here returns 404 from
# the outpost, and a user outside `admins` is denied by the binding.
#
# MFA enforcement is NOT per-application — it lives in the (UI-managed)
# default authentication flow, which all of these inherit.
version: 1
metadata:
  name: homelab-proxy-providers
  labels:
    blueprints.goauthentik.io/description: Forward-auth providers for Traefik-gated hosts
entries:
  # Blueprint files are not discovered in a guaranteed order; force the groups
  # blueprint first so the admins !Find below always resolves.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: homelab-groups
      required: true

  # --- longhorn.example.com (no auth of its own — the gate is the only
  # protection) ---
  - model: authentik_providers_proxy.proxyprovider
    id: longhorn-provider
    state: present
    identifiers:
      name: longhorn-forward-auth
    attrs:
      mode: forward_single
      external_host: https://longhorn.example.com
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    id: longhorn-app
    state: present
    identifiers:
      slug: longhorn
    attrs:
      name: Longhorn
      provider: !KeyOf longhorn-provider
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf longhorn-app
      group: !Find [authentik_core.group, [name, admins]]
    attrs:
      order: 0

  # --- privatebin.example.com (no auth of its own; public via the Cloudflare
  # tunnel) ---
