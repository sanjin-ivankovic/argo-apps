# yamllint disable-file
---
# OIDC providers for the homelab's native OIDC clients. client_ids are
# load-bearing (the Talos apiserver audience is `headlamp`; SnapOtter,
# Domain Watchdog, HedgeDoc, Stirling PDF and Semaphore configs pin theirs) and must not change. Client secrets resolve at apply
# time from worker env vars (values.yaml global.env ← authentik-oidc-clients).
#
# The issuer each consumer must configure is per application:
#   https://auth.example.com/application/o/<slug>/
#
# PKCE note: authentik accepts S256 PKCE whenever the client sends it
# (Headlamp does) but has no per-provider require_pkce toggle — accepted
# minor regression vs Authelia.
version: 1
metadata:
  name: homelab-oauth2-providers
  labels:
    blueprints.goauthentik.io/description: OIDC providers for Headlamp, SnapOtter, Domain Watchdog, HedgeDoc, Stirling PDF and Semaphore
entries:
  # Blueprint files are not discovered in a guaranteed order; force the groups
  # blueprint first so the admins !Find below always resolves.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: homelab-groups
      required: true

  # --- Scope mappings -------------------------------------------------------
  # authentik has no built-in `groups` scope (groups normally ride in
  # `profile`); Headlamp requests `openid profile email groups` and the Talos
  # apiserver maps the `groups` claim, so provide the scope explicitly and
  # keep every consumer's scope list unchanged.
  - model: authentik_providers_oauth2.scopemapping
    id: scope-groups
    state: present
    identifiers:
      name: 'homelab: groups claim'
    attrs:
      scope_name: groups
      description: Group membership
      expression: |
        return {
            "groups": [group.name for group in request.user.ak_groups.all()],
        }

  # Since authentik 2025.10 the stock email scope reports
  # email_verified: false (no verification source exists), and clients that
  # gate on it reject the login ("invalid jwt: email not verified"). Override
  # the email scope with a mapping that asserts verified. Every account here
  # is admin-created, which is the verification.
  - model: authentik_providers_oauth2.scopemapping
    id: scope-email-verified
    state: present
    identifiers:
      name: 'homelab: email claim (verified)'
    attrs:
      scope_name: email
      description: Email address, asserted verified (admin-created accounts)
      expression: |
        return {
            "email": request.user.email,
            "email_verified": True,
        }

  # --- Headlamp --------------------------------------------------------------
  # Forwards its id_token to the Kubernetes apiserver, so per-user cluster
  # RBAC hangs off this provider: the apiserver trusts issuer
  # https://auth.example.com/application/o/headlamp/ with audience `headlamp`
  # and maps preferred_username/groups with an `oidc:` prefix
  # (proxmox-infra ansible/talos/patches/controlplane.yaml). Dropping the
  # groups mapping silently revokes cluster-admin.
  - model: authentik_providers_oauth2.oauth2provider
    id: headlamp-provider
    state: present
    identifiers:
      name: headlamp-oidc
    attrs:
      client_type: confidential
      # 2026.x providers reject every authorize request when this list is
      # empty ("Invalid grant_type for provider"), so it must be explicit.
      grant_types:
        - authorization_code
        - refresh_token
      client_id: headlamp
      client_secret: !Env HEADLAMP_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_username
      # The apiserver reads claims straight out of the id_token and never
      # calls UserInfo.
      include_claims_in_id_token: true
      redirect_uris:
        - matching_mode: strict
          url: https://headlamp.example.com/oidc-callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf scope-email-verified
        - !KeyOf scope-groups
  - model: authentik_core.application
    id: headlamp-app
    state: present
    identifiers:
      slug: headlamp
    attrs:
      name: Headlamp
      provider: !KeyOf headlamp-provider
      meta_launch_url: https://headlamp.example.com
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf headlamp-app
      group: !Find [authentik_core.group, [name, admins]]
    attrs:
      order: 0

  # --- SnapOtter ---------------------------------------------------------------
  # apps/user/snapotter authenticates its own users through this provider
  # instead of a forward-auth middleware on its IngressRoute.
  - model: authentik_providers_oauth2.oauth2provider
    id: snapotter-provider
    state: present
    identifiers:
      name: snapotter-oidc
    attrs:
      client_type: confidential
      # 2026.x providers reject every authorize request when this list is
      # empty ("Invalid grant_type for provider"), so it must be explicit.
      grant_types:
        - authorization_code
        - refresh_token
      client_id: snapotter
      client_secret: !Env SNAPOTTER_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_username
      include_claims_in_id_token: true
      redirect_uris:
        - matching_mode: strict
          url: https://snapotter.example.com/api/auth/oidc/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf scope-email-verified
        - !KeyOf scope-groups
  - model: authentik_core.application
    id: snapotter-app
    state: present
    identifiers:
      slug: snapotter
    attrs:
      name: SnapOtter
      provider: !KeyOf snapotter-provider
      meta_launch_url: https://snapotter.example.com
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf snapotter-app
      group: !Find [authentik_core.group, [name, admins]]
    attrs:
      order: 0

  # --- Domain Watchdog ---------------------------------------------------------
  # apps/user/domain-watchdog logs users in through this provider (generic
  # OAuth2 client: authorize/token/userinfo, users matched by the email claim)
  # instead of a forward-auth middleware on its IngressRoute.
  - model: authentik_providers_oauth2.oauth2provider
    id: domain-watchdog-provider
    state: present
    identifiers:
      name: domain-watchdog-oidc
    attrs:
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: domain-watchdog
      client_secret: !Env DOMAIN_WATCHDOG_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_username
      include_claims_in_id_token: true
      redirect_uris:
        - matching_mode: strict
          url: https://domain-watchdog.example.com/login/oauth/check
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf scope-email-verified
        - !KeyOf scope-groups
  - model: authentik_core.application
    id: domain-watchdog-app
    state: present
    identifiers:
      slug: domain-watchdog
    attrs:
      name: Domain Watchdog
      provider: !KeyOf domain-watchdog-provider
      meta_launch_url: https://domain-watchdog.example.com
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf domain-watchdog-app
      group: !Find [authentik_core.group, [name, admins]]
    attrs:
      order: 0

  # --- HedgeDoc ----------------------------------------------------------------
  # apps/user/hedgedoc logs users in through this provider (generic OAuth2:
  # explicit authorize/token/userinfo URLs, no discovery) instead of a
  # forward-auth middleware on its IngressRoute. HedgeDoc also checks the
  # userinfo `groups` claim for `admins` (CMD_OAUTH2_ACCESS_ROLE), so
  # scope-groups is required here.
  - model: authentik_providers_oauth2.oauth2provider
    id: hedgedoc-provider
    state: present
    identifiers:
      name: hedgedoc-oidc
    attrs:
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: hedgedoc
      client_secret: !Env HEDGEDOC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_username
      include_claims_in_id_token: true
      redirect_uris:
        - matching_mode: strict
          url: https://hedgedoc.example.com/auth/oauth2/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf scope-email-verified
        - !KeyOf scope-groups
  - model: authentik_core.application
    id: hedgedoc-app
    state: present
    identifiers:
      slug: hedgedoc
    attrs:
      name: HedgeDoc
      provider: !KeyOf hedgedoc-provider
      meta_launch_url: https://hedgedoc.example.com
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf hedgedoc-app
      group: !Find [authentik_core.group, [name, admins]]
    attrs:
      order: 0

  # --- Stirling PDF ------------------------------------------------------------
  # apps/user/stirling-pdf logs users in through this provider (OIDC
  # discovery) instead of a forward-auth middleware on its IngressRoute.
  # The redirect URI's last segment must equal the app's
  # SECURITY_OAUTH2_PROVIDER (`authentik`). Stirling-PDF keys accounts on the
  # `email` claim and cannot read groups, so the admins binding below is the
  # only allow-list and scope-groups is not mapped.
  - model: authentik_providers_oauth2.oauth2provider
    id: stirling-pdf-provider
    state: present
    identifiers:
      name: stirling-pdf-oidc
    attrs:
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: stirling-pdf
      client_secret: !Env STIRLING_PDF_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_username
      include_claims_in_id_token: true
      redirect_uris:
        - matching_mode: strict
          url: https://pdf.example.com/login/oauth2/code/authentik
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf scope-email-verified
  - model: authentik_core.application
    id: stirling-pdf-app
    state: present
    identifiers:
      slug: stirling-pdf
    attrs:
      name: Stirling PDF
      provider: !KeyOf stirling-pdf-provider
      meta_launch_url: https://pdf.example.com
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf stirling-pdf-app
      group: !Find [authentik_core.group, [name, admins]]
    attrs:
      order: 0

  # --- Semaphore UI -------------------------------------------------------------
  # proxmox-infra services/semaphore logs users in through this provider (OIDC
  # discovery). The redirect URI's provider segment (`authentik`) must equal
  # the key under SEMAPHORE_OIDC_PROVIDERS. Slug is semaphore-ui because the
  # forward-auth application in 10-proxy-providers.yaml holds `semaphore`.
  # Semaphore matches accounts on the `email` claim and has no group support,
  # so the admins binding below is the only allow-list.
  - model: authentik_providers_oauth2.oauth2provider
    id: semaphore-provider
    state: present
    identifiers:
      name: semaphore-oidc
    attrs:
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: semaphore
      client_secret: !Env SEMAPHORE_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_username
      include_claims_in_id_token: true
      redirect_uris:
        - matching_mode: strict
          url: https://semaphore.example.com/api/auth/oidc/authentik/redirect/
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf scope-email-verified
  - model: authentik_core.application
    id: semaphore-ui-app
    state: present
    identifiers:
      slug: semaphore-ui
    attrs:
      name: Semaphore UI
      provider: !KeyOf semaphore-provider
      meta_launch_url: https://semaphore.example.com
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf semaphore-ui-app
      group: !Find [authentik_core.group, [name, admins]]
    attrs:
      order: 0
