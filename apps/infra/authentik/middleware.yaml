---
# Traefik ForwardAuth middleware backed by Authentik's embedded outpost. An
# app is gated by referencing this middleware on its IngressRoute plus a
# second route forwarding /outpost.goauthentik.io/ to authentik-server (the
# per-app proxy provider handles the redirect flow) — see
# blueprints/10-proxy-providers.yaml for the per-host providers.
#
# Lives in the authentik namespace; Traefik runs with
# providers.kubernetesCRD.allowCrossNamespace: true, so app IngressRoutes
# reference it as `namespace: authentik`.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forwardauth
  namespace: authentik
spec:
  forwardAuth:
    # Service port 80 → container 9000.
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    # The outpost builds its redirect from the X-Forwarded-* headers Traefik
    # sets; without this it cannot.
    trustForwardHeader: true
    # Traefik 3.7+ warns when unset.
    maxResponseBodySize: 1048576
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
