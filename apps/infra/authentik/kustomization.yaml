---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: authentik

# Chart versions track authentik releases (YYYY.M.patch) and the values
# contract moves between minors (2025.10 removed Redis entirely). Pin the
# exact version and re-render before accepting a Renovate bump.
helmCharts:
  - name: authentik
    repo: https://charts.goauthentik.io
    version: 2026.8.1
    releaseName: authentik
    namespace: authentik
    valuesFile: values.yaml

resources:
  - middleware.yaml
  - ingress
  - secrets

# Blueprint YAML mounted into the worker at /blueprints/mounted/ via the
# chart's blueprints.configMaps value. Static name: the chart references the
# ConfigMap by its literal name.
configMapGenerator:
  - name: authentik-blueprints
    files:
      - blueprints/00-groups.yaml
      - blueprints/10-proxy-providers.yaml
      - blueprints/20-oauth2-providers.yaml
      - blueprints/30-outpost.yaml
generatorOptions:
  disableNameSuffixHash: true
