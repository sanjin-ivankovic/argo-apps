---
# Proxmox VE metrics (node, storage, every LXC and VM) from the PVE API. The
# token pve-exporter@pve!prometheus has PVEAuditor on / (read-only); its
# config comes from the pve-exporter secret (an ExternalSecret). pve sits in the Mgmt zone:
# the Talos nodes reach 8006 through proxmox-infra terraform/unifi
# servers_mgmt_pve_exporter.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pve-exporter
  labels:
    app.kubernetes.io/name: pve-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pve-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pve-exporter
    spec:
      priorityClassName: normal-priority
      automountServiceAccountToken: false
      # The image names its user (prometheus) instead of a uid, which
      # runAsNonRoot cannot verify; the exporter only reads its config and
      # /opt, so it runs as nobody.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
      containers:
        - name: pve-exporter
          image: docker.io/prompve/prometheus-pve-exporter:3.10.1@sha256:5678b230735a80816755dc8b5e0fb139a6595e1d4271ace2d22ff82983d1bdf1
          args:
            - --config.file=/etc/pve-exporter/pve.yml
            - --web.listen-address=:9221
          ports:
            - name: http
              containerPort: 9221
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/pve-exporter
              readOnly: true
            # gunicorn's worker heartbeat file; without a writable /tmp the
            # worker dies on start under readOnlyRootFilesystem.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: pve-exporter
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pve-exporter
  labels:
    app.kubernetes.io/name: pve-exporter
spec:
  selector:
    app.kubernetes.io/name: pve-exporter
  ports:
    - name: http
      port: 9221
      targetPort: http
---
# The exporter is multi-target: /pve?target=<host> queries that PVE API.
# cluster and node collectors are on so guests, storage and the node all
# report; instance is set to the host name.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pve-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pve-exporter
  endpoints:
    - port: http
      path: /pve
      interval: 60s
      scrapeTimeout: 30s
      params:
        target: ["10.105.0.4"]
        module: ["default"]
        cluster: ["1"]
        node: ["1"]
      relabelings:
        - targetLabel: instance
          replacement: pve
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: pve_.*
          action: keep
