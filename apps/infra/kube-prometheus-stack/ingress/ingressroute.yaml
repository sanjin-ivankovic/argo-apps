---
# LAN only (lan entrypoint, 10.140.0.60), no Authentik. Prometheus and
# Alertmanager have no authentication of their own: anyone who reaches the
# host can query every metric and create or expire silences. The LAN is the
# boundary; a public route for either needs the authentik-forwardauth
# middleware first. Grafana has its own login (grafana-admin).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-ingressroute
  namespace: monitoring
spec:
  entryPoints:
    - lan
  routes:
    - kind: Rule
      match: Host(`grafana.example.com`)
      services:
        - kind: Service
          name: kube-prometheus-stack-grafana
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus-ingressroute
  namespace: monitoring
spec:
  entryPoints:
    - lan
  routes:
    - kind: Rule
      match: Host(`prometheus.example.com`)
      services:
        - kind: Service
          name: kube-prometheus-stack-prometheus
          port: 9090
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: alertmanager-ingressroute
  namespace: monitoring
spec:
  entryPoints:
    - lan
  routes:
    - kind: Rule
      match: Host(`alertmanager.example.com`)
      services:
        - kind: Service
          name: kube-prometheus-stack-alertmanager
          port: 9093
