---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

helmCharts:
  - name: alloy
    repo: https://grafana.github.io/helm-charts
    version: 1.15.0
    releaseName: alloy
    namespace: monitoring
    valuesFile: values.yaml
    # Offline renders advertise no CRDs; without this the chart drops its
    # ServiceMonitor.
    apiVersions:
      - monitoring.coreos.com/v1/ServiceMonitor
  # Talos machine logs; see values-talos.yaml.
  - name: alloy
    repo: https://grafana.github.io/helm-charts
    version: 1.15.0
    releaseName: alloy-talos
    namespace: monitoring
    valuesFile: values-talos.yaml
    apiVersions:
      - monitoring.coreos.com/v1/ServiceMonitor
