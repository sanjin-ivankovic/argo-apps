---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: traefik

helmCharts:
  # Official upstream Traefik chart (public docker.io/traefik image, no pull
  # secret). Moved off the DHI variant (oci://dhi.io traefik-chart 39.0.9): that
  # build shipped Traefik 3.7.2 carrying bug #13289 — the kubernetescrd provider
  # emits an empty TLS-options reference ("unknown TLS options: ") that installs
  # a connection-closing route for every router, breaking all *.example.com TLS.
  - name: traefik
    repo: oci://ghcr.io/traefik/helm
    version: 41.4.0
    releaseName: traefik
    namespace: traefik
    includeCRDs: true
    valuesFile: values.yaml

resources:
  - certificates
  - omni-cert-sync
  - secrets

patches:
  - target:
      kind: PodDisruptionBudget
      name: traefik
    patch: |-
      - op: replace
        path: /apiVersion
        value: policy/v1
