---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  # Repository credentials (SSH) - GitLab (ssh://git@source.example.com)
  - argocd-repo-gitlab-sealed-secret.yaml
  # Helm OCI registry credentials - for registry.example.com
  - argocd-registry-sealed-secret.yaml
  # Helm OCI registry credentials - for dhi.io (Docker Hardened Images)
  - argocd-dhi-registry-sealed-secret.yaml
  # Repo server Docker config for private OCI registry access
  - argocd-repo-server-dockerconfig-sealed-secret.yaml
