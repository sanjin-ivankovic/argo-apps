---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.6.1/manifests/install.yaml
  - ingress/ingressroute.yaml
  - servicemonitor.yaml
  # Repository credentials (SSH) - GitLab (ssh://git@source.example.com)
  - secrets/argocd-repo-gitlab-sealed-secret.yaml

patches:
  - path: patches/argocd-cm-patch.yaml
    target:
      kind: ConfigMap
      name: argocd-cm
  - path: patches/argocd-rbac-cm-patch.yaml
    target:
      kind: ConfigMap
      name: argocd-rbac-cm
  - path: patches/argocd-cmd-params-cm-patch.yaml
    target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
  - path: patches/argocd-ssh-known-hosts-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-ssh-known-hosts-cm
  # Dex is the SSO broker; with no dex.config or oidc.config in argocd-cm
  # every login is a local account, so its objects are dropped from the
  # upstream install.
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Dex
      metadata:
        name: argocd-dex-server
    target:
      name: ^argocd-dex-server(-network-policy)?$
  # Node placement patches for infrastructure tier
  - path: patches/node-placement-patch.json
    target:
      kind: Deployment
      name: argocd-server
  - path: patches/node-placement-patch.json
    target:
      kind: Deployment
      name: argocd-repo-server
  - path: patches/node-placement-patch.json
    target:
      kind: Deployment
      name: argocd-redis
  - path: patches/node-placement-patch.json
    target:
      kind: Deployment
      name: argocd-applicationset-controller
  - path: patches/node-placement-patch.json
    target:
      kind: Deployment
      name: argocd-notifications-controller
  - path: patches/node-placement-patch.json
    target:
      kind: StatefulSet
      name: argocd-application-controller

images:
  - name: quay.io/argoproj/argocd
    newTag: v3.6.1
