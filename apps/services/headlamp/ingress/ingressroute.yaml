---
# Headlamp UI. Signs in through Authentik OIDC and forwards the id_token to
# the apiserver (see values.yaml), so Kubernetes RBAC is the authorization
# boundary. No Traefik ForwardAuth gate here. LAN-only (lan entrypoint).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headlamp-ingressroute
  namespace: headlamp
spec:
  entryPoints:
    - lan
  routes:
    - kind: Rule
      match: Host(`headlamp.example.com`)
      services:
        - kind: Service
          name: headlamp
          port: 80
