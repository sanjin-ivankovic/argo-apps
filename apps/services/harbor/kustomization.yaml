---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: harbor

helmCharts:
  - name: harbor
    repo: https://helm.goharbor.io
    version: 1.19.4
    releaseName: harbor
    namespace: harbor
    valuesFile: values.yaml

resources:
  - ingress/ingressroute.yaml
  # Sealed secrets are generated by kryptos (kryptos/configs/harbor.yaml).
  # Each file maps to a Harbor chart existingSecret reference:
  #   harbor-core-secret         → core.existingSecret + core.existingXsrfSecret
  #   harbor-jobservice-secret   → jobservice.existingSecret
  #   harbor-registry-secret     → registry.existingSecret
  #   harbor-registry-htpasswd   → registry.credentials.existingSecret
  #   harbor-db-secret           → database.external.existingSecret
  - secrets/harbor-core-sealed-secret.yaml
  - secrets/harbor-jobservice-sealed-secret.yaml
  - secrets/harbor-registry-sealed-secret.yaml
  - secrets/harbor-registry-htpasswd-sealed-secret.yaml
  - secrets/harbor-db-sealed-secret.yaml
