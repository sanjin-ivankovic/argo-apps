---
# LAN and WireGuard only. The image's basic auth is the only gate.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: obsidian-lan-ingressroute
  namespace: obsidian
spec:
  entryPoints:
    - lan
  routes:
    - match: Host(`obsidian.example.com`)
      kind: Rule
      services:
        - name: obsidian
          port: 80
---
# CouchDB for LiveSync devices on the LAN or WireGuard. LAN only: LiveSync
# clients send CouchDB basic auth, so ForwardAuth cannot gate it, and a public
# route would publish /_utils. CouchDB answers the CORS preflights itself.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: obsidian-couchdb-ingressroute
  namespace: obsidian
spec:
  entryPoints:
    - lan
  routes:
    - match: Host(`couchdb.example.com`)
      kind: Rule
      services:
        - name: obsidian-couchdb
          port: 5984
