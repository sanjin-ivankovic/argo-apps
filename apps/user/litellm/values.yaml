---
# ============================================================================
# LiteLLM Configuration
# Helm Chart: litellm 1.0.0 (homelab custom chart)
# Purpose: LLM proxy / gateway — fronts Azure OpenAI models behind one
#          OpenAI-compatible API; backed by the shared PostgreSQL cluster.
# ============================================================================

# ============================================================================
# Node Placement & Resources
# ============================================================================

priorityClassName: normal-priority

# Tuned for homelab traffic (100-500 req/day). Memory: 2 uvicorn workers +
# Prisma client + Python imports exceed 2Gi at startup. 4Gi limit gives
# comfortable headroom; bump if OOMKilled recurs.
resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2000m"
    memory: "4Gi"

# Schedule on any worker node.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/worker
              operator: Exists

# ============================================================================
# Valkey Coordination
# ============================================================================

# Shared-Valkey connection (REDIS_HOST/PORT/DB/PASSWORD) for the
# router_settings block below. Held in its own secret, separate from
# litellm-secrets, so re-sealing it can never rotate the immutable
# LITELLM_SALT_KEY.
extraEnvFrom:
  - secretRef:
      name: litellm-valkey

# ============================================================================
# Proxy Configuration (rendered into the ConfigMap)
# ============================================================================

# LiteLLM proxy configuration rendered verbatim into the ConfigMap mounted
# at /app/proxy_server_config.yaml.
#
# All models are deployments on one Azure OpenAI resource
# (zenai-openai-swe-central). The `azure/` provider builds the
# /openai/deployments/... and /openai/responses?api-version=... paths itself,
# so api_base is the bare resource root. `model:` is azure/<deployment name>,
# case-sensitive. A deployment that only serves the Responses API needs
# `azure/responses/<name>` for /chat/completions callers to work.
proxy_config:
  model_list:
    - model_name: gpt-5.4-nano
      litellm_params:
        model: azure/gpt-5.4-nano
        api_base: https://zenai-openai-swe-central.openai.azure.com
        api_version: "2025-04-01-preview"
        api_key: os.environ/AZURE_OPENAI_KEY
    - model_name: gpt-6-astra
      litellm_params:
        model: azure/gpt-6-astra
        api_base: https://zenai-openai-swe-central.openai.azure.com
        api_version: "2025-04-01-preview"
        api_key: os.environ/AZURE_OPENAI_KEY
    - model_name: gpt-6-luna
      litellm_params:
        model: azure/gpt-6-luna
        api_base: https://zenai-openai-swe-central.openai.azure.com
        api_version: "2025-04-01-preview"
        api_key: os.environ/AZURE_OPENAI_KEY
    - model_name: gpt-6.1-sol
      litellm_params:
        model: azure/gpt-6.1-sol
        api_base: https://zenai-openai-swe-central.openai.azure.com
        api_version: "2025-04-01-preview"
        api_key: os.environ/AZURE_OPENAI_KEY
    - model_name: gpt-5.6-terra
      litellm_params:
        model: azure/gpt-5.6-terra
        api_base: https://zenai-openai-swe-central.openai.azure.com
        api_version: "2025-04-01-preview"
        api_key: os.environ/AZURE_OPENAI_KEY

  general_settings:
    master_key: os.environ/LITELLM_MASTER_KEY
    database_url: os.environ/DATABASE_URL
    database_connection_pool_limit: 10
    # UI login is per-user accounts only; without this the master key doubles
    # as a shared admin password. Requires at least one proxy_admin user with
    # its own password, or the UI has no way in (the API still accepts the
    # master key, which can create one via /user/new).
    disable_env_credential_login: true

  # The proxy runs 2 uvicorn workers (--num_workers in args). Without a
  # shared store each worker keeps its own rate-limit counters and budget
  # spend, so virtual-key budgets overshoot by up to 2x and TPM/RPM limits
  # are enforced once per worker.
  #
  # There is deliberately no redis_db key here — LiteLLM has none. The
  # logical DB index comes from the REDIS_DB env var (litellm-valkey
  # secret), which _redis.py maps onto the redis-py `db` kwarg.
  router_settings:
    routing_strategy: simple-shuffle
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    redis_password: os.environ/REDIS_PASSWORD

  litellm_settings:
    callbacks: ["prometheus"]
    json_logs: true
    set_verbose: false
    drop_params: true
