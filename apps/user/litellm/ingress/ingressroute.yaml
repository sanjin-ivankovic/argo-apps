---
# LiteLLM proxy API — authenticated by its master / virtual API keys, not a
# browser login, so no Traefik ForwardAuth. LAN-only (lan entrypoint); serves
# the OpenAI-compatible API on port 4000.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: litellm-ingressroute
  namespace: litellm
spec:
  entryPoints:
    - lan
  routes:
    - match: Host(`litellm.example.com`)
      kind: Rule
      services:
        - name: litellm
          port: 4000
