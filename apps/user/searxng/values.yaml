---
# ============================================================================
# SearXNG Configuration
# Helm Chart: searxng 2.0.0 (homelab custom chart)
# Purpose: Privacy-respecting metasearch engine; uses the shared Valkey cache.
# ============================================================================

# ============================================================================
# Node Placement & Resources
# ============================================================================

replicaCount: 1

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

priorityClassName: normal-priority

# Schedule on any worker node.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/worker
              operator: Exists

# ============================================================================
# Environment
# ============================================================================

env:
  uwsgiWorkers: "2"
  uwsgiThreads: "2"

# ============================================================================
# Secrets & Cache Backend
# ============================================================================

secrets:
  secretName: searxng-app
  keys:
    baseUrl: base-url
    secretKey: secret-key
    valkeyPassword: valkey-password

# ============================================================================
# Search Engines
# ============================================================================

# The upstream `brave` engine scrapes search.brave.com and gets rate-limited
# by Brave's bot detection (SearxEngineTooManyRequestsException, 180s
# suspension). `braveapi` is a distinct engine using the official Search API,
# so the scraper is disabled rather than left to keep throwing.
# Free API tier: 1 req/s, 2000 queries/month.
engines:
  - name: braveapi
    engine: braveapi
    shortcut: brapi
    categories: [general, web]
    # Ships as inactive upstream; must be flipped to load the engine at all.
    inactive: false
    results_per_page: 20
    apiKeySecretKey: brave-api-key
  - name: brave
    disabled: true
  - name: brave.images
    disabled: true
  - name: brave.videos
    disabled: true
  - name: brave.news
    disabled: true
  # Tor-only engines: without a Tor proxy they fail to load at every start.
  - name: ahmia
    inactive: true
  - name: torch
    inactive: true
  # These refuse to load without general.contact_url, which would put an
  # operator contact in the User-Agent sent to Wikimedia and OpenStreetMap.
  - name: wikipedia
    inactive: true
  - name: wikidata
    inactive: true
  - name: openstreetmap
    inactive: true

# Result/rate-limit cache backed by the shared Valkey (apps/data/valkey).
# Logical DB index 1. Moving it discards cached results and rate-limit
# counters — harmless, they rebuild.
valkey:
  url: "redis://valkey-primary.valkey.svc.cluster.local:6379/1"

# json serves ?format=json to the searxng server of the homelab MCP plugin
# (mcp-plugins). The route is lan-only and SearXNG has no login, so the API
# is no wider than the HTML UI.
search:
  formats:
    - html
    - json
