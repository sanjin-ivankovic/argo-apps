---
# SearXNG metasearch — no built-in login and no Traefik ForwardAuth gate.
# LAN-only (lan entrypoint); a websecure/tunnel route for it needs the
# authentik-forwardauth middleware.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: searxng-ingressroute
  namespace: searxng
spec:
  entryPoints:
    - lan
  routes:
    - kind: Rule
      match: Host(`search.example.com`)
      services:
        - kind: Service
          name: searxng
          port: 8080
