---
# Docmost handles authentication itself (built-in login; SSO is a paid
# feature). LAN-only (lan entrypoint), no Traefik ForwardAuth gate. The
# editor's collaboration WebSocket on /collab passes through unchanged.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: docmost-ingressroute
  namespace: docmost
spec:
  entryPoints:
    - lan
  routes:
    - match: Host(`docmost.example.com`)
      kind: Rule
      services:
        - name: docmost
          port: 80
