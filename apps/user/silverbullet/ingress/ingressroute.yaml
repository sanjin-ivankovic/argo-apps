---
# On both entrypoints (tunnel + LAN). No authentik-forwardauth middleware:
# SilverBullet requires its own accounts and signs users in through
# Authentik's OIDC provider; ForwardAuth breaks its background requests when
# the proxy session expires (silverbullet#2100). Cloudflare Access gates the
# tunnel hostname.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: silverbullet-ingressroute
  namespace: silverbullet
spec:
  entryPoints:
    - public
    - lan
  routes:
    - match: Host(`silverbullet.example.com`)
      kind: Rule
      services:
        - name: silverbullet
          port: 80
