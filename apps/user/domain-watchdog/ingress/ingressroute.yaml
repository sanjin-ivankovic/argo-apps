---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: domain-watchdog-ingressroute
  namespace: domain-watchdog
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`domain-watchdog.example.com`)
      # No authentik-forwardauth middleware: Domain Watchdog logs in via
      # Authentik's OIDC provider (registration disabled), and its calendar/RSS
      # feeds and API tokens must stay reachable without a browser session.
      services:
        - kind: Service
          name: domain-watchdog
          port: 80
