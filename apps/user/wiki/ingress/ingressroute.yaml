---
# Wiki.js handles authentication itself (built-in local login). LAN-only
# (lan entrypoint) and no Traefik ForwardAuth gate here. Live collaboration
# uses WebSockets on /_collab, which Traefik passes through unchanged.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wiki-ingressroute
  namespace: wiki
spec:
  entryPoints:
    - lan
  routes:
    - match: Host(`wiki.example.com`)
      kind: Rule
      services:
        - name: wiki
          port: 80
