---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wiki

# Upstream Wiki.js chart. It renders no generated values when postgresql is
# off and every credential comes from existingSecret, so ArgoCD sees no drift.
helmCharts:
  - name: wiki
    repo: oci://ghcr.io/requarks/charts
    version: 3.1.1
    releaseName: wiki
    namespace: wiki
    valuesFile: values.yaml
    # The chart ships a helm-test Pod; ArgoCD would treat it as a live resource.
    skipTests: true

resources:
  - ingress/ingressroute.yaml
  - secrets/wiki-sealed-secret.yaml
