---
# On both entrypoints (tunnel + LAN). No authentik-forwardauth middleware:
# HedgeDoc allows no anonymous or local-account access and logs in via
# Authentik's OIDC provider.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hedgedoc-ingressroute
  namespace: hedgedoc
spec:
  entryPoints:
    - websecure
    - lan
  routes:
    - kind: Rule
      match: Host(`hedgedoc.example.com`)
      services:
        - kind: Service
          name: hedgedoc
          port: 80
