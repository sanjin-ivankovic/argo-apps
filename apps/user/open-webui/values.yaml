---
# ============================================================================
# Open WebUI Configuration
# Helm Chart: open-webui 1.0.1 (homelab custom chart)
# Purpose: Multi-model AI chat front-end; routes all models through LiteLLM.
# ============================================================================

# ============================================================================
# Node Placement & Resources
# ============================================================================

priorityClassName: normal-priority

# First-boot HuggingFace downloads (sentence-transformers MiniLM + Whisper base)
# push resident memory past 1Gi. 3Gi limit gives comfortable headroom; revisit
# downwards once embeddings route through LiteLLM and local STT is disabled.
resources:
  requests:
    cpu: "100m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "3Gi"

# Schedule on any worker node.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/worker
              operator: Exists

# ============================================================================
# Persistence
# ============================================================================

# SQLite + uploads + RAG embeddings live here.
persistence:
  enabled: true
  storageClass: ""        # use Longhorn default
  size: 5Gi

# ============================================================================
# Environment
# ============================================================================

# Non-secret environment. App secrets (WEBUI_SECRET_KEY, OPENAI_API_KEY) come
# from envFrom on the open-webui-secrets Secret.
env:
  # LiteLLM upstream (in-cluster, no TLS overhead).
  OPENAI_API_BASE_URL: "http://litellm.litellm.svc.cluster.local:4000/v1"

  # Forward authenticated user identity to LiteLLM for per-user spend tracking.
  ENABLE_FORWARD_USER_INFO_HEADERS: "true"

  # Disable Ollama — LiteLLM handles all model routing.
  ENABLE_OLLAMA_API: "false"

  WEBUI_AUTH: "true"
  WEBUI_URL: "https://open-webui.example.com"

  # Open WebUI uses its own built-in email/password login form.
  # NOTE: ENABLE_LOGIN_FORM is a PersistentConfig — the env value seeds the DB on
  # first boot. If the DB has a cached "false", this env won't override it; the
  # cached value must be cleared once (e.g. via the DB) to re-show the form.
  ENABLE_LOGIN_FORM: "true"
