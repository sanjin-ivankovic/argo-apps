---
# Open WebUI on the LAN (lan entrypoint): built-in login only, no ForwardAuth.
# Open WebUI handles authentication itself via its built-in login form
# (ENABLE_LOGIN_FORM=true; see values.yaml).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: open-webui-ingressroute
  namespace: open-webui
spec:
  entryPoints:
    - lan
  routes:
    - kind: Rule
      match: Host(`chat.example.com`)
      services:
        - kind: Service
          name: open-webui
          port: 8080
---
# Open WebUI — external (work) access via the Cloudflare tunnel, gated behind
# the Authentik ForwardAuth SSO IN ADDITION to Open WebUI's built-in login
# (defense in depth). The lan route for the same host (above) keeps built-in
# login only; the tunnel reaches only this websecure route, so all external
# traffic passes through SSO. The login
# redirect targets auth.example.com, which must also be a tunnel public
# hostname or external visitors cannot complete the flow.
#
# Requires the matching chat proxy provider in
# apps/infra/authentik/blueprints/10-proxy-providers.yaml — a host with no
# provider is a 404 from the outpost, so the pair must move together.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: open-webui-external-ingressroute
  namespace: open-webui
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`chat.example.com`)
      middlewares:
        - name: authentik-forwardauth
          namespace: authentik
      services:
        - kind: Service
          name: open-webui
          port: 8080
    # The outpost's own endpoints (login redirect target, callback). Longer
    # rule wins Traefik's default priority; carries no auth middleware.
    - kind: Rule
      match: Host(`chat.example.com`) && PathPrefix(`/outpost.goauthentik.io/`)
      services:
        - kind: Service
          name: authentik-server
          namespace: authentik
          port: 80
