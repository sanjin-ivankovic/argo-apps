---
# LAN only: no public route and no Authentik. Actual enforces its own server
# password. No headers middleware: the server sets COOP/COEP itself, and a
# duplicate header breaks the client (SharedArrayBufferMissing).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: actual-ingressroute
  namespace: actual
spec:
  entryPoints:
    - lan
  routes:
    - match: Host(`actual.example.com`)
      kind: Rule
      services:
        - name: actual
          port: 80
