---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: stirling-pdf-ingressroute
  namespace: stirling-pdf
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`pdf.example.com`)
      # No authentik-forwardauth middleware: Stirling-PDF requires login
      # (SECURITY_ENABLELOGIN) and signs users in through Authentik's OIDC
      # provider, whose admins binding is the allow-list.
      services:
        - kind: Service
          name: stirling-pdf
          port: 80
