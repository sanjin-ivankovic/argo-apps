---
# Public route through the Cloudflare tunnel, behind the Authentik ForwardAuth
# gate in front of OpenGist's own login. Requires the opengist proxy provider
# in apps/infra/authentik/blueprints/10-proxy-providers.yaml and its outpost
# entry, or the gate answers 404.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: opengist-ingressroute
  namespace: opengist
spec:
  entryPoints:
    - public
  routes:
    - match: Host(`gist.example.com`)
      middlewares:
        - name: authentik-forwardauth
          namespace: authentik
      kind: Rule
      services:
        - name: opengist
          port: 80
    # The outpost's own endpoints (login redirect target, callback). Longer
    # rule wins Traefik's default priority; carries no auth middleware.
    - match: Host(`gist.example.com`) && PathPrefix(`/outpost.goauthentik.io/`)
      kind: Rule
      services:
        - name: authentik-server
          namespace: authentik
          port: 80
---
# LAN route: same backend, no ForwardAuth gate (OpenGist keeps its own login).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: opengist-lan-ingressroute
  namespace: opengist
spec:
  entryPoints:
    - lan
  routes:
    - match: Host(`gist.example.com`)
      kind: Rule
      services:
        - name: opengist
          port: 80
