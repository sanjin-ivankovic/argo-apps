[pytest]
python_files = test_*.py
addopts =
    --strict-markers
    --tb=short
    --cov=detect_apps
    --cov=validate_app
    --cov-report=term-missing
    --cov-report=xml:coverage.xml

[coverage:report]
show_missing = True
# validate_app.main() shells out to kustomize and kubeconform, which the
# validate:apps job exercises; the unit tests cover the logic around it.
fail_under = 60
